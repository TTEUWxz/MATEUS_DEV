<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif">
  <!-- Background -->
  <rect width="1200" height="750" fill="#F5F3FF"/>

  <!-- NAV -->
  <rect width="1200" height="56" fill="#fff"/>
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#E5E7EB" stroke-width="1"/>
  <text x="32" y="36" font-size="17" font-weight="800" fill="#111827">CoachPro</text>
  <text x="210" y="36" font-size="13" fill="#374151">About</text>
  <text x="340" y="36" font-size="13" fill="#374151">Programs</text>
  <text x="470" y="36" font-size="13" fill="#374151">Results</text>
  <text x="580" y="36" font-size="13" fill="#374151">Blog</text>
  <rect x="920" y="14" width="200" height="30" rx="6" fill="#7C3AED"/>
  <text x="1020" y="34" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Book a Free Call →</text>

  <!-- HERO SECTION -->
  <!-- Badge -->
  <rect x="32" y="78" width="200" height="28" rx="14" fill="#EDE9FE"/>
  <text x="44" y="97" font-size="11" fill="#7C3AED" font-weight="600">★ Certified Executive Coach</text>

  <!-- Headline -->
  <text x="32" y="152" font-size="40" font-weight="800" fill="#111827">Turn your expertise</text>
  <text x="32" y="200" font-size="40" font-weight="800" fill="#111827">into a <tspan fill="#7C3AED">6-figure</tspan></text>
  <text x="32" y="248" font-size="40" font-weight="800" fill="#111827">coaching business</text>

  <!-- Sub -->
  <text x="32" y="282" font-size="14" fill="#6B7280">Stop undercharging and overdelivering. Get a proven</text>
  <text x="32" y="302" font-size="14" fill="#6B7280">system to attract premium clients and scale your impact.</text>

  <!-- CTAs -->
  <rect x="32" y="322" width="230" height="44" rx="8" fill="#7C3AED"/>
  <text x="147" y="350" font-size="14" fill="#fff" text-anchor="middle" font-weight="600">Book Your Free Strategy Call</text>
  <text x="310" y="350" font-size="14" fill="#7C3AED">See results ↓</text>

  <!-- CLIENT CARD (right side) -->
  <rect x="700" y="70" width="290" height="320" rx="16" fill="#7C3AED"/>
  <!-- Card inner border -->
  <rect x="716" y="86" width="258" height="288" rx="10" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Avatar -->
  <circle cx="845" cy="150" r="36" fill="rgba(255,255,255,0.2)"/>
  <text x="845" y="162" font-size="28" text-anchor="middle">👩</text>
  <!-- Name -->
  <text x="845" y="210" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Sarah Johnson</text>
  <text x="845" y="230" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">Business Coach · New York</text>
  <!-- Divider -->
  <line x1="730" y1="248" x2="960" y2="248" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Stats row -->
  <text x="780" y="278" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">$12k</text>
  <text x="780" y="298" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Monthly</text>
  <text x="845" y="278" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">47</text>
  <text x="845" y="298" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Clients</text>
  <text x="910" y="278" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">4.9★</text>
  <text x="910" y="298" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Rating</text>
  <!-- Progress bar -->
  <rect x="730" y="318" width="258" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
  <rect x="730" y="318" width="190" height="8" rx="4" fill="rgba(255,255,255,0.6)"/>
  <text x="845" y="346" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Goal progress: 74%</text>

  <!-- STATS BAR -->
  <rect x="0" y="415" width="1200" height="62" fill="#111827"/>
  <text x="150" y="441" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">10+</text>
  <text x="150" y="461" font-size="11" fill="#9CA3AF" text-anchor="middle">Projects</text>
  <line x1="300" y1="428" x2="300" y2="462" stroke="#374151" stroke-width="1"/>
  <text x="450" y="441" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">5-10 days</text>
  <text x="450" y="461" font-size="11" fill="#9CA3AF" text-anchor="middle">Avg Delivery</text>
  <line x1="600" y1="428" x2="600" y2="462" stroke="#374151" stroke-width="1"/>
  <text x="750" y="441" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">$0</text>
  <text x="750" y="461" font-size="11" fill="#9CA3AF" text-anchor="middle">Paid Ads</text>
  <line x1="900" y1="428" x2="900" y2="462" stroke="#374151" stroke-width="1"/>
  <text x="1050" y="441" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">98%</text>
  <text x="1050" y="461" font-size="11" fill="#9CA3AF" text-anchor="middle">Satisfaction</text>

  <!-- FEATURES SECTION -->
  <text x="600" y="528" font-size="20" font-weight="700" fill="#111827" text-anchor="middle">Everything you need to scale</text>

  <!-- 3 feature cards -->
  <rect x="32" y="544" width="360" height="100" rx="10" fill="#fff" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="52" y="564" width="28" height="28" rx="6" fill="#EDE9FE"/>
  <text x="66" y="584" font-size="14" text-anchor="middle">🎯</text>
  <text x="94" y="575" font-size="14" font-weight="700" fill="#111827">Client System</text>
  <text x="94" y="595" font-size="12" fill="#6B7280">Attract and convert ideal clients</text>
  <text x="94" y="612" font-size="12" fill="#6B7280">without cold outreach.</text>

  <rect x="420" y="544" width="360" height="100" rx="10" fill="#fff" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="440" y="564" width="28" height="28" rx="6" fill="#EDE9FE"/>
  <text x="454" y="584" font-size="14" text-anchor="middle">💰</text>
  <text x="482" y="575" font-size="14" font-weight="700" fill="#111827">Premium Pricing</text>
  <text x="482" y="595" font-size="12" fill="#6B7280">Learn to charge what you're</text>
  <text x="482" y="612" font-size="12" fill="#6B7280">worth. Most raise rates 2–3x.</text>

  <rect x="808" y="544" width="360" height="100" rx="10" fill="#fff" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="828" y="564" width="28" height="28" rx="6" fill="#EDE9FE"/>
  <text x="842" y="584" font-size="14" text-anchor="middle">🗓</text>
  <text x="870" y="575" font-size="14" font-weight="700" fill="#111827">90-Day Roadmap</text>
  <text x="870" y="595" font-size="12" fill="#6B7280">A clear week-by-week plan so</text>
  <text x="870" y="612" font-size="12" fill="#6B7280">you always know your next move.</text>

  <!-- CTA FOOTER STRIP -->
  <rect x="0" y="664" width="1200" height="86" fill="#7C3AED"/>
  <text x="600" y="700" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Ready to fill your calendar?</text>
  <text x="600" y="724" font-size="13" fill="rgba(255,255,255,0.75)" text-anchor="middle">Book a free 30-min strategy call. No pitch, just value.</text>
</svg>
