<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif">
  <!-- Background -->
  <rect width="1200" height="750" fill="#13111C"/>

  <!-- TOP NAV -->
  <rect width="1200" height="56" fill="#1A1726"/>
  <!-- Logo -->
  <rect x="24" y="18" width="22" height="22" rx="4" fill="#7C6AF7"/>
  <text x="52" y="34" font-size="15" font-weight="700" fill="#fff">FlowCRM</text>
  <!-- Nav links -->
  <text x="150" y="34" font-size="13" fill="#fff" font-weight="600">Dashboard</text>
  <text x="260" y="34" font-size="13" fill="#9CA3AF">Contacts</text>
  <text x="350" y="34" font-size="13" fill="#9CA3AF">Pipeline</text>
  <text x="440" y="34" font-size="13" fill="#9CA3AF">Automations</text>
  <text x="565" y="34" font-size="13" fill="#9CA3AF">Reports</text>
  <!-- Buttons -->
  <rect x="860" y="14" width="90" height="30" rx="6" fill="transparent" stroke="#374151" stroke-width="1.5"/>
  <text x="905" y="34" font-size="12" fill="#D1D5DB" text-anchor="middle">Sign in</text>
  <rect x="965" y="14" width="110" height="30" rx="6" fill="#7C6AF7"/>
  <text x="1020" y="34" font-size="12" fill="#fff" text-anchor="middle">Start free →</text>

  <!-- HERO SECTION -->
  <!-- Purple blob -->
  <ellipse cx="600" cy="115" rx="220" ry="40" fill="#5B4FD4" opacity="0.55"/>
  <!-- Badge -->
  <rect x="470" y="95" width="260" height="28" rx="14" fill="#2D2A45"/>
  <circle cx="488" cy="109" r="5" fill="#22C55E"/>
  <text x="500" y="114" font-size="12" fill="#E2E8F0">Now with AI automation</text>
  <!-- Headline -->
  <text x="600" y="165" font-size="38" font-weight="800" fill="#fff" text-anchor="middle">Your clients. Your pipeline.</text>
  <text x="600" y="210" font-size="38" font-weight="800" fill="#7C6AF7" text-anchor="middle">Under control.</text>
  <!-- Subtext -->
  <text x="600" y="240" font-size="14" fill="#9CA3AF" text-anchor="middle">A CRM built for solo operators and small teams.</text>
  <!-- CTA buttons -->
  <rect x="450" y="258" width="160" height="38" rx="8" fill="#7C6AF7"/>
  <text x="530" y="283" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">Start for free →</text>
  <rect x="625" y="258" width="150" height="38" rx="8" fill="transparent" stroke="#374151" stroke-width="1.5"/>
  <text x="700" y="283" font-size="13" fill="#D1D5DB" text-anchor="middle">▶ Watch demo</text>

  <!-- BROWSER WINDOW / APP PREVIEW -->
  <rect x="40" y="315" width="1120" height="420" rx="12" fill="#1E1B2E" stroke="#2D2A45" stroke-width="1.5"/>
  <!-- Browser chrome -->
  <rect x="40" y="315" width="1120" height="36" rx="12" fill="#252235"/>
  <rect x="40" y="339" width="1120" height="12" fill="#252235"/>
  <circle cx="68" cy="333" r="6" fill="#FF5F57"/>
  <circle cx="90" cy="333" r="6" fill="#FEBC2E"/>
  <circle cx="112" cy="333" r="6" fill="#28C840"/>
  <rect x="200" y="323" width="600" height="20" rx="10" fill="#1A1726"/>
  <text x="500" y="338" font-size="11" fill="#6B7280" text-anchor="middle">app.flowcrm.io/dashboard</text>

  <!-- SIDEBAR -->
  <rect x="40" y="351" width="160" height="384" fill="#1A1726"/>
  <rect x="48" y="370" width="144" height="32" rx="6" fill="#2D2A45"/>
  <text x="70" y="391" font-size="12" fill="#fff" font-weight="600">□ Dashboard</text>
  <text x="62" y="422" font-size="12" fill="#6B7280">□ Contacts</text>
  <text x="62" y="452" font-size="12" fill="#6B7280">□ Pipeline</text>
  <text x="62" y="482" font-size="12" fill="#6B7280">+ Automations</text>
  <text x="62" y="512" font-size="12" fill="#6B7280">□ Reports</text>
  <text x="62" y="542" font-size="12" fill="#6B7280">⚙ Settings</text>

  <!-- MAIN CONTENT -->
  <!-- 4 metric cards -->
  <rect x="215" y="360" width="228" height="90" rx="8" fill="#252235"/>
  <text x="228" y="382" font-size="10" fill="#6B7280" letter-spacing="0.05em">MONTHLY REVENUE</text>
  <text x="228" y="412" font-size="26" font-weight="700" fill="#fff">$24,800</text>
  <text x="228" y="436" font-size="12" fill="#22C55E">↑ 18.3%</text>

  <rect x="455" y="360" width="228" height="90" rx="8" fill="#252235"/>
  <text x="468" y="382" font-size="10" fill="#6B7280" letter-spacing="0.05em">ACTIVE DEALS</text>
  <text x="468" y="412" font-size="26" font-weight="700" fill="#fff">47</text>
  <text x="468" y="436" font-size="12" fill="#22C55E">↑ 5 new</text>

  <rect x="695" y="360" width="228" height="90" rx="8" fill="#252235"/>
  <text x="708" y="382" font-size="10" fill="#6B7280" letter-spacing="0.05em">CONVERSION RATE</text>
  <text x="708" y="412" font-size="26" font-weight="700" fill="#fff">34.2%</text>
  <text x="708" y="436" font-size="12" fill="#22C55E">↑ 2.1%</text>

  <rect x="935" y="360" width="218" height="90" rx="8" fill="#252235"/>
  <text x="948" y="382" font-size="10" fill="#6B7280" letter-spacing="0.05em">AVG. DEAL SIZE</text>
  <text x="948" y="412" font-size="26" font-weight="700" fill="#fff">$1,240</text>
  <text x="948" y="436" font-size="12" fill="#EF4444">↓ -$80</text>

  <!-- Revenue chart card -->
  <rect x="215" y="462" width="700" height="278" rx="8" fill="#252235"/>
  <text x="232" y="486" font-size="11" fill="#6B7280" letter-spacing="0.06em">REVENUE THIS MONTH</text>
  <!-- Bar chart -->
  <rect x="240" y="580" width="36" height="100" rx="3" fill="#4F46B8" opacity="0.6"/>
  <rect x="290" y="555" width="36" height="125" rx="3" fill="#4F46B8" opacity="0.6"/>
  <rect x="340" y="570" width="36" height="110" rx="3" fill="#4F46B8" opacity="0.6"/>
  <rect x="390" y="530" width="36" height="150" rx="3" fill="#7C6AF7"/>
  <rect x="440" y="510" width="36" height="170" rx="3" fill="#7C6AF7"/>
  <rect x="490" y="545" width="36" height="135" rx="3" fill="#7C6AF7"/>
  <rect x="540" y="540" width="36" height="140" rx="3" fill="#7C6AF7"/>
  <rect x="590" y="500" width="36" height="180" rx="3" fill="#7C6AF7"/>
  <rect x="640" y="490" width="36" height="190" rx="3" fill="#9580FF"/>
  <!-- X-axis line -->
  <line x1="232" y1="685" x2="900" y2="685" stroke="#2D2A45" stroke-width="1"/>

  <!-- Deal stages donut -->
  <rect x="928" y="462" width="224" height="278" rx="8" fill="#252235"/>
  <text x="944" y="486" font-size="11" fill="#6B7280" letter-spacing="0.06em">DEAL STAGES</text>
  <circle cx="1040" cy="590" r="60" fill="none" stroke="#2D2A45" stroke-width="20"/>
  <circle cx="1040" cy="590" r="60" fill="none" stroke="#7C6AF7" stroke-width="20"
    stroke-dasharray="245 135" stroke-dashoffset="0" transform="rotate(-90 1040 590)"/>
  <text x="1040" y="585" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">65%</text>
  <text x="1040" y="603" font-size="11" fill="#9CA3AF" text-anchor="middle">Qualified</text>
</svg>
