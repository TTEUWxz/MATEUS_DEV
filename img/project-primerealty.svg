<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif">
  <!-- White nav -->
  <rect width="1200" height="750" fill="#fff"/>
  <rect width="1200" height="56" fill="#fff"/>
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#E5E7EB" stroke-width="1"/>
  <text x="32" y="36" font-size="17" font-weight="800" fill="#111827">PrimeRealty</text>
  <text x="220" y="36" font-size="13" fill="#374151">Buy</text>
  <text x="300" y="36" font-size="13" fill="#374151">Sell</text>
  <text x="370" y="36" font-size="13" fill="#374151">Rent</text>
  <text x="440" y="36" font-size="13" fill="#374151">Agents</text>
  <rect x="920" y="16" width="160" height="30" rx="6" fill="#06B6D4"/>
  <text x="1000" y="36" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Get Free Valuation</text>

  <!-- Hero: blue gradient split -->
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="55%" stop-color="#1E40AF"/>
      <stop offset="56%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="blueHero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>
  <rect x="0" y="56" width="700" height="340" fill="url(#blueHero)"/>
  <rect x="700" y="56" width="500" height="340" fill="#DBEAFE"/>

  <!-- Badge -->
  <rect x="32" y="80" width="215" height="26" rx="13" fill="#0EA5E9"/>
  <text x="44" y="98" font-size="11" fill="#fff" font-weight="600">📍 #1 Agency in Miami — 2024</text>

  <!-- Hero headline -->
  <text x="32" y="142" font-size="36" font-weight="800" fill="#fff">Find your</text>
  <text x="32" y="188" font-size="36" font-weight="800" fill="#67E8F9">dream home</text>
  <text x="32" y="234" font-size="36" font-weight="800" fill="#fff">in Miami</text>
  <text x="32" y="268" font-size="13" fill="#BFDBFE">Over 2,400 exclusive listings. Expert agents.</text>
  <text x="32" y="288" font-size="13" fill="#BFDBFE">Close in 30 days or less.</text>

  <!-- Search bar -->
  <rect x="32" y="305" width="360" height="44" rx="22" fill="#fff"/>
  <text x="80" y="333" font-size="13" fill="#9CA3AF">Miami Beach, FL</text>
  <rect x="282" y="311" width="100" height="32" rx="16" fill="#0EA5E9"/>
  <text x="332" y="332" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Search →</text>

  <!-- Right image placeholder (house) -->
  <rect x="720" y="70" width="460" height="315" rx="8" fill="#93C5FD" opacity="0.4"/>
  <text x="950" y="235" font-size="48" text-anchor="middle">🏡</text>

  <!-- Stats bar -->
  <rect x="0" y="396" width="1200" height="62" fill="#111827"/>
  <text x="150" y="422" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2,400+</text>
  <text x="150" y="444" font-size="11" fill="#9CA3AF" text-anchor="middle">Active Listings</text>
  <line x1="300" y1="410" x2="300" y2="450" stroke="#374151" stroke-width="1"/>
  <text x="450" y="422" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">$1.2B</text>
  <text x="450" y="444" font-size="11" fill="#9CA3AF" text-anchor="middle">In Sales 2024</text>
  <line x1="600" y1="410" x2="600" y2="450" stroke="#374151" stroke-width="1"/>
  <text x="750" y="422" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">98%</text>
  <text x="750" y="444" font-size="11" fill="#9CA3AF" text-anchor="middle">Client Satisfaction</text>
  <line x1="900" y1="410" x2="900" y2="450" stroke="#374151" stroke-width="1"/>
  <text x="1050" y="422" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">28 days</text>
  <text x="1050" y="444" font-size="11" fill="#9CA3AF" text-anchor="middle">Avg. Time to Close</text>

  <!-- Featured Properties -->
  <text x="32" y="500" font-size="20" font-weight="700" fill="#111827">Featured Properties</text>
  <text x="1100" y="500" font-size="13" fill="#0EA5E9" text-anchor="middle">View all →</text>

  <!-- Property card 1 -->
  <rect x="32" y="516" width="368" height="220" rx="10" fill="#fff" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="32" y="516" width="368" height="128" rx="10" fill="#1D4ED8"/>
  <rect x="32" y="620" width="368" height="24" fill="#1D4ED8"/>
  <rect x="44" y="526" width="80" height="22" rx="4" fill="#fff"/>
  <text x="84" y="542" font-size="10" fill="#111827" text-anchor="middle" font-weight="700">FOR SALE</text>
  <rect x="44" y="614" width="90" height="24" rx="4" fill="#111827"/>
  <text x="89" y="631" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">$895,000</text>
  <text x="48" y="668" font-size="14" font-weight="700" fill="#111827">Luxury Waterfront Villa</text>
  <text x="48" y="688" font-size="12" fill="#6B7280">4 bed · 3 bath · 2,800 sqft</text>
  <circle cx="56" cy="708" r="4" fill="#22C55E"/>
  <text x="66" y="712" font-size="11" fill="#22C55E">Available now</text>

  <!-- Property card 2 -->
  <rect x="416" y="516" width="368" height="220" rx="10" fill="#fff" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="416" y="516" width="368" height="128" rx="10" fill="#065F46"/>
  <rect x="416" y="620" width="368" height="24" fill="#065F46"/>
  <rect x="428" y="526" width="50" height="22" rx="4" fill="#fff"/>
  <text x="453" y="542" font-size="10" fill="#111827" text-anchor="middle" font-weight="700">NEW</text>
  <rect x="428" y="614" width="90" height="24" rx="4" fill="#111827"/>
  <text x="473" y="631" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">$425,000</text>
  <text x="432" y="668" font-size="14" font-weight="700" fill="#111827">Modern Downtown Condo</text>
  <text x="432" y="688" font-size="12" fill="#6B7280">2 bed · 2 bath · 1,150 sqft</text>
  <circle cx="440" cy="708" r="4" fill="#22C55E"/>
  <text x="450" y="712" font-size="11" fill="#22C55E">Available now</text>

  <!-- Property card 3 -->
  <rect x="800" y="516" width="368" height="220" rx="10" fill="#fff" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="800" y="516" width="368" height="128" rx="10" fill="#581C87"/>
  <rect x="800" y="620" width="368" height="24" fill="#581C87"/>
  <rect x="812" y="526" width="46" height="22" rx="4" fill="#EF4444"/>
  <text x="835" y="542" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">HOT</text>
  <rect x="812" y="614" width="100" height="24" rx="4" fill="#111827"/>
  <text x="862" y="631" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">$1,250,000</text>
  <text x="816" y="668" font-size="14" font-weight="700" fill="#111827">Coral Gables Estate</text>
  <text x="816" y="688" font-size="12" fill="#6B7280">5 bed · 4 bath · 4,200 sqft</text>
  <circle cx="824" cy="708" r="4" fill="#22C55E"/>
  <text x="834" y="712" font-size="11" fill="#22C55E">Available now</text>
</svg>
